<div class="sidebar">

    <!-- ================= LOGO ================= -->

    <div class="logo">

        <img src="{{ url_for('static', filename='images/logo.png') }}"
             alt="KisanVision360">

        <h2>KisanVision360</h2>

        <p>AI Smart Farming</p>

    </div>

    <!-- ================= MENU ================= -->

    <nav class="sidebar-menu">

        <ul>

            <li class="{% if request.path=='/farmer' %}active{% endif %}">
                <a href="/farmer">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
            </li>

            <li class="{% if request.path=='/weather' %}active{% endif %}">
                <a href="/weather">
                    <i class="fa-solid fa-cloud-sun"></i>
                    <span>Weather</span>
                </a>
            </li>

            <li class="{% if request.path=='/recommendation' %}active{% endif %}">
                <a href="/recommendation">
                    <i class="fa-solid fa-seedling"></i>
                    <span>AI Recommendation</span>
                </a>
            </li>

            <li class="{% if request.path=='/irrigation' %}active{% endif %}">
                <a href="/irrigation">
                    <i class="fa-solid fa-droplet"></i>
                    <span>Irrigation</span>
                </a>
            </li>

            <li class="{% if request.path=='/disease' %}active{% endif %}">
                <a href="/disease">
                    <i class="fa-solid fa-bug"></i>
                    <span>Disease Detection</span>
                </a>
            </li>

            <li class="{% if request.path=='/marketplace' %}active{% endif %}">
                <a href="/marketplace">
                    <i class="fa-solid fa-store"></i>
                    <span>Marketplace</span>
                </a>
            </li>

            <li class="{% if request.path=='/orders' %}active{% endif %}">
                <a href="/orders">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Orders</span>
                </a>
            </li>

            <li class="{% if request.path=='/reports' %}active{% endif %}">
                <a href="/reports">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Reports</span>
                </a>
            </li>

            <li class="{% if request.path=='/finance' %}active{% endif %}">
                <a href="/finance">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                    <span>Finance</span>
                </a>
            </li>

            <li class="{% if request.path=='/government' %}active{% endif %}">
                <a href="/government">
                    <i class="fa-solid fa-landmark"></i>
                    <span>Gov Schemes</span>
                </a>
            </li>

            <li class="{% if request.path=='/settings' %}active{% endif %}">
                <a href="/settings">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </li>

            <li>
                <a href="/logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Logout</span>
                </a>
            </li>

        </ul>

    </nav>

    <!-- ================= USER ================= -->

    <div class="sidebar-profile">

        <img src="{{ url_for('static', filename='images/farmer.jpg') }}"
             alt="Farmer">

        <div>

            <h4>{{ name }}</h4>

            <p>Farmer</p>

        </div>

    </div>

</div>

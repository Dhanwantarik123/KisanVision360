<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KisanVision360 | Income</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/sidebar.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/income.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

{% include "components/sidebar.html" %}

<div class="main-content">

<div class="topbar">

<div>

<h2>💵 Farm Income</h2>

<p>Manage Crop Sales & Other Income</p>

</div>

<div class="profile">

<img src="{{ url_for('static', filename='images/farmer.jpg') }}">

<div>

<h4>{{ name }}</h4>

<p>Farmer</p>

</div>

</div>

</div>

<div class="form-card">

<h2>Add Income</h2>

<form method="POST">

<label>Description</label>

<input
type="text"
name="description"
placeholder="e.g. Wheat Sale"
required>

<label>Amount (₹)</label>

<input
type="number"
name="amount"
step="0.01"
required>

<button type="submit">

<i class="fa-solid fa-plus"></i>

Add Income

</button>

</form>

</div>

<div class="table-card">

<h2>Income History</h2>

<table>

<tr>

<th>Date</th>

<th>Description</th>

<th>Amount</th>

</tr>

{% for row in income_list %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>₹ {{ row[2] }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</body>

</html>

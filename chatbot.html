<!-- Floating AI Button -->

<div class="chatbot-button" onclick="toggleChat()">

    <i class="fa-solid fa-robot"></i>

</div>

<!-- Chatbot Window -->

<div class="chatbot-box" id="chatBox">

    <div class="chat-header">

        <div>

            🤖 <b>KisanVision360 AI</b><br>

            <small>🟢 Online</small>

        </div>

        <i class="fa-solid fa-xmark" onclick="toggleChat()"></i>

    </div>

    <div class="chat-body" id="chatBody">

        <div class="bot-message">

            👋 Hello <b>{{ name }}</b>

            <br><br>

            I can help you with:

            <br>🌦 Weather
            <br>🌱 Crop Recommendation
            <br>💧 Irrigation
            <br>🐛 Disease Detection
            <br>🧪 Fertilizer
            <br>📈 Market Prices
            <br>🏛 Government Schemes

        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userMessage"
            placeholder="Ask AI...">

        <button onclick="sendMessage()">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </div>

</div>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Sell Product | KisanVision360</title>

<link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/sidebar.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static',
      filename='css/add_product.css') }}">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<div class="dashboard-container">


{% include "components/sidebar.html" %}


<div class="main-content">


<!-- TOP BAR -->

<div class="topbar">

    <div>

        <h1>
            <i class="fa-solid fa-plus-circle"></i>
            Sell Your Product
        </h1>

        <p>
            List your farm product in KisanVision360 Marketplace
        </p>

    </div>

</div>


<!-- FORM CARD -->

<div class="sell-card">


<div class="form-title">

    <div class="title-icon">

        <i class="fa-solid fa-seedling"></i>

    </div>

    <div>

        <h2>
            Product Details
        </h2>

        <p>
            Enter your product information
        </p>

    </div>

</div>


{% if error %}

<div class="error-message">

    <i class="fa-solid fa-circle-exclamation"></i>

    {{ error }}

</div>

{% endif %}


<form
    action="/add-product"
    method="POST"
    enctype="multipart/form-data">


<!-- PRODUCT NAME -->

<div class="form-group">

    <label>
        <i class="fa-solid fa-wheat-awn"></i>
        Product Name
    </label>

    <input
        type="text"
        name="product_name"
        placeholder="Example: Tomato"
        required>

</div>


<!-- CATEGORY -->

<div class="form-group">

    <label>
        <i class="fa-solid fa-layer-group"></i>
        Category
    </label>

    <select
        name="category"
        required>

        <option value="">
            Select Category
        </option>

        <option value="Vegetables">
            Vegetables
        </option>

        <option value="Fruits">
            Fruits
        </option>

        <option value="Grains">
            Grains
        </option>

        <option value="Pulses">
            Pulses
        </option>

        <option value="Spices">
            Spices
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>


<!-- QUANTITY -->

<div class="two-column">


<div class="form-group">

    <label>
        <i class="fa-solid fa-weight-scale"></i>
        Quantity
    </label>

    <input
        type="number"
        name="quantity"
        min="1"
        placeholder="Example: 100"
        required>

</div>


<div class="form-group">

    <label>
        Unit
    </label>

    <select name="unit">

        <option value="kg">
            Kilogram (kg)
        </option>

        <option value="quintal">
            Quintal
        </option>

        <option value="ton">
            Ton
        </option>

        <option value="piece">
            Piece
        </option>

    </select>

</div>


</div>


<!-- PRICE -->

<div class="form-group">

    <label>

        <i class="fa-solid fa-indian-rupee-sign"></i>

        Price

    </label>

    <input
        type="number"
        name="price"
        min="0"
        step="0.01"
        placeholder="Example: 2500"
        required>

</div>


<!-- IMAGE -->

<div class="form-group">

    <label>

        <i class="fa-solid fa-image"></i>

        Product Image

    </label>

    <input
        type="file"
        name="image"
        accept="image/*">

    <small>
        Upload a clear image of your product.
    </small>

</div>


<!-- DESCRIPTION -->

<div class="form-group">

    <label>

        <i class="fa-solid fa-align-left"></i>

        Description

    </label>

    <textarea
        name="description"
        rows="5"
        placeholder="Enter product details..."></textarea>

</div>


<!-- BUTTONS -->

<div class="form-buttons">


<a href="/marketplace"
   class="cancel-btn">

    <i class="fa-solid fa-arrow-left"></i>

    Cancel

</a>


<button
    type="submit"
    class="sell-submit">

    <i class="fa-solid fa-upload"></i>

    List Product

</button>


</div>


</form>


</div>


<footer>

    <i class="fa-solid fa-leaf"></i>

    KisanVision360

    <span>•</span>

    Smart Farming Marketplace

</footer>


</div>

</div>

</body>

</html>

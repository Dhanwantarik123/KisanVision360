<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KisanVision360 Notifications</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(232, 245, 233, 0.94),
                    rgba(232, 245, 233, 0.94)
                ),
                url("../images/background.jpg");

            background-size: cover;

            background-position: center;

        }


        /* ================= CARD ================= */

        .card {

            width: 100%;

            max-width: 420px;

            background: rgba(255,255,255,0.98);

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.15);

        }


        /* ================= ICON ================= */

        .notification-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #e8f5e9;

            color: #08783f;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }


        /* ================= TITLE ================= */

        .card h2 {

            color: #14532d;

            font-size: 24px;

            margin-bottom: 8px;

        }


        .card p {

            color: #777;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 25px;

        }


        /* ================= TOGGLE AREA ================= */

        .toggle-box {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;

        }


        /* ================= SWITCH ================= */

        .switch {

            position: relative;

            display: inline-block;

            width: 58px;

            height: 30px;

        }


        .switch input {

            opacity: 0;

            width: 0;

            height: 0;

        }


        .slider {

            position: absolute;

            cursor: pointer;

            inset: 0;

            background: #ccc;

            border-radius: 30px;

            transition: 0.3s;

        }


        .slider:before {

            content: "";

            position: absolute;

            width: 24px;

            height: 24px;

            left: 3px;

            bottom: 3px;

            background: white;

            border-radius: 50%;

            transition: 0.3s;

            box-shadow:
                0 2px 5px rgba(0,0,0,.2);

        }


        input:checked + .slider {

            background: #08783f;

        }


        input:checked + .slider:before {

            transform: translateX(28px);

        }


        /* ================= STATUS ================= */

        #status {

            font-weight: bold;

            font-size: 16px;

            color: #08783f;

            min-width: 40px;

        }


        /* ================= BUTTON ================= */

        .test-btn {

            border: none;

            background: #08783f;

            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: .25s;

        }


        .test-btn:hover {

            background: #065f32;

            transform: translateY(-2px);

        }


        /* ================= MESSAGE ================= */

        #message {

            margin-top: 15px;

            font-size: 13px;

            min-height: 20px;

        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            body {

                padding: 15px;

            }

            .card {

                padding: 28px 20px;

                max-width: 100%;

            }

            .card h2 {

                font-size: 21px;

            }

            .card p {

                font-size: 13px;

            }

        }


        @media (max-width: 350px) {

            .card {

                padding: 22px 15px;

            }

            .notification-icon {

                width: 65px;

                height: 65px;

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


<div class="card">


    <!-- ICON -->

    <div class="notification-icon">

        🔔

    </div>


    <!-- TITLE -->

    <h2>

        Notifications

    </h2>


    <p>

        Get weather updates and important
        farming alerts from KisanVision360.

    </p>


    <!-- TOGGLE -->

    <div class="toggle-box">

        <label class="switch">

            <input
                type="checkbox"
                id="notification"
                onchange="toggleNotification()">

            <span class="slider"></span>

        </label>


        <span id="status">

            OFF

        </span>

    </div>


    <!-- TEST BUTTON -->

    <button
        class="test-btn"
        onclick="testNotification()">

        🔔 Test Notification

    </button>


    <!-- MESSAGE -->

    <div id="message"></div>


</div>



<script>

/* =========================================================
   LOAD SAVED NOTIFICATION SETTING
========================================================= */

window.addEventListener("load", function () {

    const checkbox =
        document.getElementById("notification");

    const status =
        document.getElementById("status");

    const saved =
        localStorage.getItem("notification");


    if (saved === "ON") {

        checkbox.checked = true;

        status.innerHTML = "ON";

        status.style.color = "#08783f";

    }

    else {

        checkbox.checked = false;

        status.innerHTML = "OFF";

        status.style.color = "#777";

    }

});


/* =========================================================
   TOGGLE NOTIFICATION
========================================================= */

async function toggleNotification() {

    const checkbox =
        document.getElementById("notification");

    const status =
        document.getElementById("status");

    const message =
        document.getElementById("message");


    /* ================= ON ================= */

    if (checkbox.checked) {

        localStorage.setItem(
            "notification",
            "ON"
        );

        status.innerHTML = "ON";

        status.style.color = "#08783f";


        /* Request permission */

        if ("Notification" in window) {

            if (Notification.permission === "default") {

                const permission =
                    await Notification.requestPermission();

                if (permission !== "granted") {

                    checkbox.checked = false;

                    localStorage.setItem(
                        "notification",
                        "OFF"
                    );

                    status.innerHTML = "OFF";

                    status.style.color = "#777";

                    message.innerHTML =
                        "⚠️ Notification permission was not granted.";

                    message.style.color = "#e53935";

                    return;

                }

            }


            if (Notification.permission === "granted") {

                message.innerHTML =
                    "✅ Notifications enabled.";

                message.style.color = "#08783f";

            }

        }

    }


    /* ================= OFF ================= */

    else {

        localStorage.setItem(
            "notification",
            "OFF"
        );

        status.innerHTML = "OFF";

        status.style.color = "#777";

        message.innerHTML =
            "🔕 Notifications disabled.";

        message.style.color = "#777";

    }

}


/* =========================================================
   TEST NOTIFICATION
========================================================= */

async function testNotification() {

    const message =
        document.getElementById("message");


    /* Browser support */

    if (!("Notification" in window)) {

        message.innerHTML =
            "❌ This browser does not support notifications.";

        message.style.color = "#e53935";

        return;

    }


    /* Permission request */

    if (Notification.permission === "default") {

        const permission =
            await Notification.requestPermission();

        if (permission !== "granted") {

            message.innerHTML =
                "⚠️ Please allow notifications in your browser.";

            message.style.color = "#e53935";

            return;

        }

    }


    /* Permission denied */

    if (Notification.permission === "denied") {

        message.innerHTML =
            "❌ Notifications are blocked. Allow them from browser settings.";

        message.style.color = "#e53935";

        return;

    }


    /* Send notification */

    new Notification(
        "🌾 KisanVision360",
        {
            body:
                "Weather and farming alerts are enabled.",
            icon:
                "../images/logo.png"
        }
    );


    message.innerHTML =
        "✅ Test notification sent successfully.";

    message.style.color =
        "#08783f";

}


/* =========================================================
   AUTOMATIC FARMING ALERT
========================================================= */

function sendFarmingAlert(messageText) {

    const enabled =
        localStorage.getItem("notification");


    if (enabled !== "ON") {

        return;

    }


    if (!("Notification" in window)) {

        return;

    }


    if (Notification.permission !== "granted") {

        return;

    }


    new Notification(
        "🌾 KisanVision360 Farming Alert",
        {
            body: messageText,

            icon:
                "../images/logo.png"
        }
    );

}


/* =========================================================
   EXAMPLE ALERT
========================================================= */

/*
   You can call this function from your
   weather / irrigation JavaScript.

   Example:

   sendFarmingAlert(
       "💧 Irrigation is recommended for your crop."
   );
*/


</script>


</body>

</html>

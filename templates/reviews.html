<!DOCTYPE html>

<html>

<head>

<title>
Machine Reviews
</title>


<link rel="stylesheet"
href="{{url_for('static',
filename='css/reviews.css')}}">


</head>


<body>


<div class="container">


<h1>
⭐ Farmer Reviews
</h1>



{% for review in reviews %}


<div class="review">


<h2>
{{review.user}}
</h2>


<h3>
{{review.rating}}
</h3>


<p>
{{review.comment}}
</p>


</div>



{% endfor %}



</div>


</body>

</html>

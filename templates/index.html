<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>KisanVision360 | Smart Agriculture</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }


        body {

            min-height: 100vh;

            background-image:
                url("{{ url_for('static', filename='images/background.jpg') }}");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* ================= OVERLAY ================= */

        .overlay {

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.58);

            backdrop-filter: blur(5px);

        }


        /* ================= MAIN CARD ================= */

        .card-box {

            position: relative;

            z-index: 2;

            width: 650px;

            max-width: 92%;

            padding: 40px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255,255,255,0.2);

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.4);

            text-align: center;

            color: white;

        }


        /* ================= LOGO ================= */

        .logo {

            width: 190px;

            height: 190px;

            object-fit: contain;

            margin-bottom: 15px;

            border-radius: 50%;

            filter: drop-shadow(
                0 0 25px rgba(255,255,255,0.3)
            );

        }


        /* ================= TITLE ================= */

        h1 {

            font-size: 52px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .subtitle {

            font-size: 19px;

            opacity: 0.9;

            margin-bottom: 28px;

        }


        /* ================= FEATURES ================= */

        .features {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;

            margin-bottom: 30px;

        }


        .feature {

            background: rgba(255,255,255,0.14);

            border: 1px solid rgba(255,255,255,0.15);

            padding: 10px 17px;

            border-radius: 50px;

            font-size: 14px;

        }


        .feature i {

            color: #7CFC00;

            margin-right: 7px;

        }


        /* ================= LANGUAGE ================= */

        .language-title {

            font-size: 18px;

            margin-bottom: 10px;

        }


        .language-select {

            height: 55px;

            border-radius: 12px;

            font-size: 17px;

            border: none;

            padding-left: 18px;

            margin-bottom: 20px;

        }


        .language-select:focus {

            box-shadow:
                0 0 0 3px rgba(40,167,69,0.3);

        }


        /* ================= BUTTON ================= */

        .btn-start {

            width: 100%;

            height: 55px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-size: 19px;

            font-weight: 600;

            background: #28a745;

            border: none;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            transition: 0.3s;

        }


        .btn-start:hover {

            background: #1d7f33;

            color: white;

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(0,0,0,0.3);

        }


        /* ================= LOGIN ================= */

        .login-text {

            margin-top: 18px;

            font-size: 14px;

            opacity: 0.9;

        }


        .login-link {

            color: #7CFC00;

            text-decoration: none;

            font-weight: 600;

        }


        .login-link:hover {

            text-decoration: underline;

        }


        /* ================= FOOTER ================= */

        .footer {

            margin-top: 22px;

            font-size: 13px;

            opacity: 0.75;

        }


        /* ================= MOBILE ================= */

        @media(max-width:768px) {

            body {

                overflow-y: auto;

                padding: 20px 0;

            }


            .card-box {

                width: 92%;

                padding: 28px 20px;

                border-radius: 22px;

            }


            .logo {

                width: 130px;

                height: 130px;

            }


            h1 {

                font-size: 36px;

            }


            .subtitle {

                font-size: 16px;

            }


            .feature {

                font-size: 13px;

                padding: 9px 13px;

            }

        }


    </style>

</head>


<body>


<!-- ================= BACKGROUND ================= -->

<div class="overlay"></div>



<!-- ================= MAIN CARD ================= -->

<div class="card-box">


    <!-- LOGO -->

    <img
        src="{{ url_for(
            'static',
            filename='images/logo.png'
        ) }}"
        class="logo"
        alt="KisanVision360 Logo">



    <!-- TITLE -->

    <h1>
        KisanVision360
    </h1>


    <p class="subtitle">

        🌾 AI Powered Smart Agriculture Platform

    </p>



    <!-- FEATURES -->

    <div class="features">


        <div class="feature">

            <i class="fa-solid fa-cloud-sun"></i>

            Live Weather

        </div>


        <div class="feature">

            <i class="fa-solid fa-seedling"></i>

            AI Crop Advisory

        </div>


        <div class="feature">

            <i class="fa-solid fa-chart-line"></i>

            Market Prices

        </div>


        <div class="feature">

            <i class="fa-solid fa-robot"></i>

            AI Assistant

        </div>


    </div>



    <!-- LANGUAGE -->

    <div class="language-title">

        🌐 Select Your Language

    </div>


    <select
        id="language"
        class="form-select language-select">

        <option value="en">
            English
        </option>

        <option value="hi">
            हिन्दी
        </option>

        <option value="mr">
            मराठी
        </option>

        <option value="kn">
            ಕನ್ನಡ
        </option>

        <option value="te">
            తెలుగు
        </option>

        <option value="ta">
            தமிழ்
        </option>

        <option value="ml">
            മലയാളം
        </option>

        <option value="gu">
            ગુજરાતી
        </option>

        <option value="pa">
            ਪੰਜਾਬੀ
        </option>

        <option value="bn">
            বাংলা
        </option>

    </select>



    <!-- ENTER BUTTON -->

    <a
        href="/login"
        class="btn-start"
        onclick="saveLanguage()">

        <i class="fa-solid fa-arrow-right"></i>

        Continue to Login

    </a>



    <!-- LOGIN TEXT -->

    <div class="login-text">

        Already have an account?

        <a
            href="/login"
            class="login-link">

            Login

        </a>

    </div>



    <!-- FOOTER -->

    <div class="footer">

        © 2026 KisanVision360

        <span>•</span>

        Smart Farming • Better Tomorrow

        <br>

        🇮🇳 Made for Indian Farmers

    </div>


</div>



<!-- ================= JAVASCRIPT ================= -->

<script>


function saveLanguage() {

    const language =
        document.getElementById("language").value;


    localStorage.setItem(
        "kisanvision360_language",
        language
    );

}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>KisanVision360 | Login</title>


<!-- LOGIN CSS -->

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">


<!-- FONT AWESOME -->

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* ================= GOOGLE TRANSLATE HIDE ================= */

#google_translate_element {
    display: none !important;
}

.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate {
    display: none !important;
}

body {
    top: 0 !important;
}

.goog-te-gadget {
    font-size: 0 !important;
}

.goog-logo-link {
    display: none !important;
}

.goog-te-balloon-frame {
    display: none !important;
}

.goog-te-menu-value {
    display: none !important;
}


/* ================= ERROR ================= */

.login-error {

    background: #ff4d4d;

    color: white;

    padding: 12px 15px;

    border-radius: 8px;

    margin-bottom: 18px;

    font-size: 14px;

    text-align: left;

}


/* ================= LANGUAGE ================= */

.language-link {

    display: inline-block;

    margin-top: 5px;

    text-decoration: none;

    color: #2e7d32;

    font-weight: 600;

}

.language-link:hover {

    text-decoration: underline;

}

</style>

</head>


<body>


<div class="overlay">


<div class="login-box">


<!-- ================= LOGO ================= -->

<img
    src="{{ url_for(
        'static',
        filename='images/logo.png'
    ) }}"
    class="logo"
    alt="KisanVision360 Logo">


<!-- ================= TITLE ================= -->

<h1>
    KisanVision360
</h1>


<p>
    AI Powered Smart Agriculture Platform
</p>


<!-- ================= FEATURES ================= -->

<div class="ai-tag">

    🤖 AI

    <span>|</span>

    🌦 Weather

    <span>|</span>

    🌾 Marketplace

</div>


<!-- ================= ERROR ================= -->

{% if error %}

<div class="login-error">

    <i class="fa-solid fa-circle-exclamation"></i>

    {{ error }}

</div>

{% endif %}


<!-- ================= LOGIN FORM ================= -->

<form
    action="{{ url_for('login') }}"
    method="POST">


<!-- MOBILE / EMAIL -->

<div class="input-box">

    <i class="fas fa-user"></i>

    <input
        type="text"
        name="login"
        placeholder="Mobile Number or Email"
        autocomplete="username"
        required>

</div>


<!-- PASSWORD -->

<div class="input-box">

    <i class="fas fa-lock"></i>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        autocomplete="current-password"
        required>

    <i
        class="fas fa-eye eye"
        id="passwordEye"
        onclick="togglePassword()">
    </i>

</div>


<!-- ================= OPTIONS ================= -->

<div class="options">


<label>

    <input
        type="checkbox"
        name="remember"
        value="1">

    Remember Me

</label>

<a href="{{ url_for('forgot_password') }}">

    Forgot Password?

</a>


</div>


<!-- ================= LOGIN ================= -->

<button
    type="submit"
    class="login-btn">

    <i class="fas fa-right-to-bracket"></i>

    Login

</button>


</form>


<!-- ================= DIVIDER ================= -->

<div class="divider">

    <span>OR</span>

</div>


<!-- ================= SIGNUP ================= -->

<a href="/signup"
   class="signup-link">

    <button
        class="signup-btn"
        type="button">

        <i class="fas fa-user-plus"></i>

        Create New Account

    </button>

</a>


<!-- ================= LANGUAGE ================= -->

<a href="/language"
   class="language-link">

    🌐 Change Language

</a>


<!-- GOOGLE TRANSLATE -->

<div id="google_translate_element"></div>


</div>

</div>



<script>

/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

function togglePassword() {

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("passwordEye");


    if (password.type === "password") {

        password.type = "text";

        eye.classList.remove("fa-eye");

        eye.classList.add("fa-eye-slash");

    } else {

        password.type = "password";

        eye.classList.remove("fa-eye-slash");

        eye.classList.add("fa-eye");

    }

}


/* =====================================================
   GOOGLE TRANSLATE
===================================================== */

function googleTranslateElementInit() {

    new google.translate.TranslateElement({

        pageLanguage: "en",

        includedLanguages:
        "en,hi,mr,kn,te,ta,ml,gu,pa,bn",

        autoDisplay: false

    }, "google_translate_element");

}


/* =====================================================
   APPLY SAVED LANGUAGE
===================================================== */

function applySavedLanguage() {

    const savedLanguage =
        localStorage.getItem(
            "kisanvision360_language"
        );


    /* English does not need translation */

    if (
        !savedLanguage ||
        savedLanguage === "en"
    ) {

        return;

    }


    let attempts = 0;


    const timer =
        setInterval(function () {


            const select =
                document.querySelector(
                    ".goog-te-combo"
                );


            attempts++;


            if (select) {


                select.value =
                    savedLanguage;


                select.dispatchEvent(
                    new Event(
                        "change",
                        {
                            bubbles: true
                        }
                    )
                );


                clearInterval(timer);

            }


            /* Stop after 20 attempts */

            if (attempts >= 20) {

                clearInterval(timer);

            }


        }, 500);

}


/* =====================================================
   GOOGLE TRANSLATE BAR REMOVAL
===================================================== */

function removeTranslateBar() {

    const frames =
        document.querySelectorAll(
            ".goog-te-banner-frame"
        );


    frames.forEach(function(frame) {

        frame.style.display =
            "none";

    });


    document.body.style.top =
        "0px";

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
    "load",
    function() {


        setTimeout(
            applySavedLanguage,
            1000
        );


        setInterval(
            removeTranslateBar,
            500
        );


    }
);

</script>


<!-- GOOGLE TRANSLATE SCRIPT -->

<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>


</body>

</html>
